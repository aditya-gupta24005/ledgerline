server:
  port: 8081

spring:
  application:
    name: order-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerline
    username: ledgerline
    password: ledgerline
    hikari:
      # The outbox write runs on the single engine thread, and callers wait at most 5 s for it (OrderGateway).
      # Hikari's default 30 s wait for a connection during a database outage would block every later command and
      # turn the halt into generic 500 timeouts, so fail well inside that window and halt with a 503 instead.
      connection-timeout: 2000
  flyway:
    schemas: order_service
    default-schema: order_service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Bounds how long send() blocks for metadata while the broker is down (default 60 s),
        # so a relay run fails fast and retries instead of holding the advisory lock for a minute.
        max.block.ms: 5000

ledgerline:
  currency: USD
  outbox:
    relay:
      poll-interval: 200ms
      batch-size: 100
      send-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
